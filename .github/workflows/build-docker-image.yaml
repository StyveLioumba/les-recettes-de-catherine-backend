name: Build and Deploy image private registry

on:
  push:
    branches:
      - dev

  workflow_dispatch: # Déclenchement manuel

env:
  DOCKERHUB_REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # Checkout le code de la branche
      - name: Checkout repository
        uses: actions/checkout@v2

      # Login to the Docker registry
      - name: Login to technostrea Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: technostrea/recettes-de-catherine:dev-latest, technostrea/recettes-de-catherine:dev-$GITHUB_SHA