name: Build and Deploy image private registry

on:
  push:
    branches:
      - dev

  workflow_dispatch: # Déclenchement manuel

env:
  DOCKERHUB_REGISTRY: ${{ secrets.DOCKERHUB_REGISTRY }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}

    steps:
      # Checkout le code de la branche
      - name: Checkout repository
        uses: actions/checkout@v2

      # Connecter à Docker Hub
      - name: Login to technostrea Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: 'true'
          labels: |
            org.opencontainers.image.title=Recettes de Catherine
            org.opencontainers.image.description=Application de gestion des recettes
            org.opencontainers.image.version=${{ github.run_number }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
          tags: |
            ${{ env.DOCKERHUB_REGISTRY }}/technostrea/recettes-de-catherine:dev-latest
            ${{ env.DOCKERHUB_REGISTRY }}/technostrea/recettes-de-catherine:dev-${{ github.run_number }}
          

